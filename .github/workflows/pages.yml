name: Deploy Portfolio and Doxygen to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get install doxygen graphviz -y

      - name: Generate Doxygen Documentation
        run: |
          cd src
          doxygen Doxyfile

      - name: Prepare Site Payload
        run: |
          mkdir _site
          cp index.html education.html projects.html _site/
          cp -r css _site/
          
          # Creates _site/docs/html so your docs/html/index.html links work perfectly
          mkdir -p _site/docs/html
          cp -r docs/html/* _site/docs/html/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4